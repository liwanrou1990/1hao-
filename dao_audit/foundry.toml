[profile.default]
src = "contracts"
test = "test"
out = "out"
libs = ["lib"]
# Offline, pinned compiler: use the vendored solc binary so no network fetch is attempted.
solc = "/root/.foundry/bin/solc"
offline = true
auto_detect_solc = false
optimizer = true
optimizer_runs = 200
# Deterministic local test EVM
evm_version = "cancun"
fs_permissions = [{ access = "read-write", path = "./reports_out" }]
verbosity = 2

[fmt]
line_length = 110
