# 真实数据市场监控配置（只读）。所有结果必须来自真实数据；源不可达时记 UNAVAILABLE。
# 不承诺固定收益；净收益非正或证据不足一律 NO TRADE。

# 数据新鲜度上限（秒）：超过则标 STALE，不参与 TRADE 决策
max_staleness_s: 120

# 只读 EVM RPC（需环境网络策略放行这些主机才可达）
chains:
  ethereum:
    rpc: "https://eth.llamarpc.com"
    rpcs: ["https://eth.llamarpc.com", "https://cloudflare-eth.com", "https://rpc.ankr.com/eth"]
    chain_id: 1
    alchemy_env: "ALCHEMY_ETH_URL"     # 若设置该环境变量则加入失败切换（需同时放行 *.g.alchemy.com）
  base:
    rpc: "https://mainnet.base.org"
    rpcs: ["https://mainnet.base.org"]
    chain_id: 8453
  arbitrum:
    rpc: "https://arb1.arbitrum.io/rpc"
    rpcs: ["https://arb1.arbitrum.io/rpc"]
    chain_id: 42161
    alchemy_env: "ALCHEMY_ARB_URL"

# 关注的 DAO（Snapshot 治理空间 + 链上金库地址，公开标识）
daos:
  - name: "Aave"
    snapshot_space: "aavedao.eth"
    chain: ethereum
    treasury: "0x25F2226B597E8F9514B3F68F00f494cF4f286491"   # Aave Ecosystem Reserve (公开)
    token_symbol: "AAVE"
    coingecko_id: "aave"
  - name: "Uniswap"
    snapshot_space: "uniswapgovernance.eth"
    chain: ethereum
    treasury: "0x1a9C8182C09F50C8318d769245beA52c32BE35BC"   # Uniswap Timelock (公开)
    token_symbol: "UNI"
    coingecko_id: "uniswap"
  - name: "Arbitrum"
    snapshot_space: "arbitrumfoundation.eth"
    chain: arbitrum
    treasury: ""
    token_symbol: "ARB"
    coingecko_id: "arbitrum"
  - name: "ENS"
    snapshot_space: "ens.eth"
    chain: ethereum
    treasury: ""
    token_symbol: "ENS"
    coingecko_id: "ethereum-name-service"
  - name: "GMX"
    snapshot_space: "gmx.eth"
    chain: arbitrum
    treasury: ""
    token_symbol: "GMX"
    coingecko_id: "gmx"
  - name: "Lido"
    snapshot_space: "lido-snapshot.eth"
    chain: ethereum
    treasury: ""
    token_symbol: "LDO"
    coingecko_id: "lido-dao"

# 关注代币（DefiLlama coin key）
tokens:
  - key: "coingecko:ethereum"
    symbol: "ETH"
  - key: "coingecko:aave"
    symbol: "AAVE"
  - key: "coingecko:uniswap"
    symbol: "UNI"
  - key: "coingecko:arbitrum"
    symbol: "ARB"
  - key: "coingecko:ethereum-name-service"
    symbol: "ENS"
  - key: "coingecko:gmx"
    symbol: "GMX"
  - key: "coingecko:lido-dao"
    symbol: "LDO"

# 成本模型参数
costs:
  dex_fee_bps: 30          # 0.30% swap 手续费
  taker_slippage_bps: 10   # 基础滑点假设
  gas_limit: 180000        # 一次 swap 估算 gas
  # gas_price 从 RPC 实时取；不可达则该项 NO TRADE
  trade_notional_usd: 10000

# 决策阈值
thresholds:
  min_net_bps: 15          # 净收益需 > 0.15% 才考虑 TRADE
  min_evidence_sources: 2  # 至少两个独立 OK 数据源

# event-edge estimator 参数
edge:
  horizons_h: [24, 72, 168]     # 持仓窗口（小时）：1d/3d/7d
  benchmark_coingecko_id: "ethereum"   # 基准（超额收益相对 ETH）
  min_events: 8                 # 最小样本量
  t_threshold: 1.65             # 单边 ~95% 显著
  edge_cost_bps: 50             # 估计阶段的成本扣减（bps）
  max_proposals_per_space: 300  # 每空间取最近 N 条历史提案
  price_period: "1d"            # DefiLlama 日线（事件时间按日对齐，见文档局限）
