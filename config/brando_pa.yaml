# Brando Price Action 量化交易引擎（brando_pa）参数。全部为研究/模拟参数，不是收益承诺，默认禁止真实下单。
# 单位约定：bps = 万分之一；pct = 小数（0.005 = 0.5%）；atr 倍数以对应周期 ATR(14) 为基准。

symbols: [BTCUSDT, ETHUSDT]           # 预留：SOLUSDT, HYPEUSDT（static-klines 有 SOL；HYPE 需交易所适配器）
reserved_symbols: [SOLUSDT, HYPEUSDT]

timeframes:
  weekly: 1w
  daily: 1d
  structure: 4h
  execution: 15m                     # 实盘/模拟盘执行周期；回测可用 --exec-tf 覆盖（15m 数据自 2024-12-30，1h 自 2022-01，4h 自 2017-08）

data:
  own_dir: data_store/brando_pa                      # 本引擎自己的 K 线仓（15m/1h/1w）；1d/4h 只读复用 data_store/spot90/bars
  spot90_dir: data_store/spot90
  static_klines:
    raw_base: https://raw.githubusercontent.com/finom/static-klines/main/.klines-cache
    windows:                                          # 来自 finom/static-klines README：窗口起点与长度
      15m: {anchor: "2024-12-30", unit: weeks, step: 1}
      30m: {anchor: "2024-01-01", unit: weeks, step: 2}
      1h:  {anchor: "2022-01-01", unit: months, step: 1}
      4h:  {anchor: "2017-07-01", unit: months, step: 3}
      1d:  {anchor: "2016-01-01", unit: months, step: 24}
      1w:  {anchor: "2010-01-01", unit: months, step: 120}
  max_bar_age_multiplier: 3          # 最新收盘 K 线落后超过 3 根执行周期 → 数据过期，不开新仓（模拟盘）
  exchange_adapter: static_klines    # static_klines | bitget_public（api.bitget.com 可达时）

levels:
  swing_k: {1w: 2, 1d: 3, 4h: 3, 15m: 3, 1h: 3}      # 分形确认左右各 k 根；摆动点在第 i+k 根收盘后才算“已确认”
  atr_n: 14
  zone_width_atr: {1w: 0.15, 1d: 0.25, 4h: 0.30}     # 区域半宽 = 该周期 ATR × 系数（波动率自适应）
  zone_max_width_pct: 0.010                          # 区域半宽上限 1.0%（防止周线 ATR 把区域撑成几千美元的“大饼”）
  zone_min_width_pct: 0.0015                         # 区域半宽下限 0.15%
  cluster_atr: 0.5                                   # 摆动点价格差 < 0.5 ATR 归为同一区域
  touch_gap_bars: 2                                  # 两次触及之间至少隔 2 根 K 线才算新触及
  break_buffer_atr: 0.10                             # 收盘越过区域边界 ≥ 0.10 ATR 才算有效突破（否则为噪声/触及）
  break_confirm_bars: 1                              # 突破后再 N 根收盘仍在区域外才确认（1 = 下一根）
  min_touches: 1                                     # 进入关键位候选的最少触及次数（摆动点本身算 1 次）
  tf_weight: {1w: 3.0, 1d: 2.0, 4h: 1.0}
  max_zones_each_side: 6
  lookback_bars: {1w: 260, 1d: 400, 4h: 600}

structure_entry:
  micro_k: 3                          # 执行周期微结构分形参数（1h/15m 均用 3；confirmed_idx = idx + 3）

structure:
  tf: 4h
  swing_k: 3
  range_atr: 0.5                      # 相邻摆动高/低差 < 0.5 ATR 视为“持平”（不算 HH/LL）

regime:                               # 环境分类（用于过滤与分组统计），只用已收盘日线
  trend_ma: 50
  trend_ma_long: 200
  highvol_rv_n: 20
  highvol_pct: 0.80                   # rv20 处于过去 365 日 80% 分位以上 → 高波动
  range_adx_n: 14
  range_adx_max: 20

strategies:
  A_breakout_retest:
    enabled: true
    break_tf: 4h                      # 用 4h 收盘判断关键位突破
    zone_tfs: [1w, 1d]                # 可被突破的关键位来自哪些周期
    break_buffer_atr: 0.15            # 4h 收盘越过区域 ≥ 0.15×ATR(4h)
    max_wait_retest_bars: 48          # 执行周期 K 线数（15m×48 = 12h）内必须回踩，否则作废
    retest_tolerance_atr: 0.25        # 回踩进入 区域边界±0.25×ATR(exec)
    confirm_close_pct: 0.60           # 确认 K 线收盘位于其振幅上 60%（做多）/ 下 40%（做空）
    confirm_within_bars: 8            # 回踩触及后 8 根执行 K 线内出现确认
    invalidate_close_beyond_atr: 0.10 # 执行周期收盘回到区域另一侧超过 0.10 ATR → 设置失效
    sl_buffer_atr: 0.50               # 止损 = 结构失效点 外 0.5×ATR(exec)
    tp_mode: next_zone_or_rr          # next_zone_or_rr | rr
    tp_rr: 2.5
    trail_after_rr: 1.5               # 浮盈达 1.5R 后把止损移到保本（可关：null）
    max_hold_bars: 192                # 持仓最长 192 根执行 K 线（15m×192 = 2 天）
  B_reclaim:
    enabled: true
    zone_tfs: [1w, 1d, 4h]
    break_tf: exec                    # 用执行周期 K 线判断假突破（exec | 4h）
    min_break_depth_atr: 0.15         # 越过区域边界的最小深度（相对 exec ATR）
    max_break_depth_atr: 1.50         # 超过此深度视为真突破，不做反向
    max_bars_outside: 6               # 在区域外停留不超过 6 根执行 K 线即需收复
    reclaim_close_pct: 0.55           # 收复 K 线收盘位于其振幅上 55%（做多）
    break_volume_ratio_min: 0.0       # 可选：突破根成交量/均量 ≥ 该值（0 = 不要求）
    sl_buffer_atr: 0.30
    tp_mode: next_zone_or_rr
    tp_rr: 2.0
    trail_after_rr: 1.5
    max_hold_bars: 96
  C_rejection:
    enabled: true
    zone_tfs: [1w, 1d]
    signal_tf: exec                   # 拒绝 K 线所在周期
    wick_ratio_min: 0.55              # 反向影线/全振幅 ≥ 0.55
    body_atr_min: 0.10                # 实体 ≥ 0.10 ATR（排除十字星噪声）
    close_pct_min: 0.65               # 收盘位于振幅上 65%（支撑拒绝做多）
    range_atr_min: 0.80               # K 线振幅 ≥ 0.8 ATR（量化“强势”）
    allow_counter_trend: false        # 4h 结构逆势是否允许
    counter_trend_wick_ratio_min: 0.70
    sl_buffer_atr: 0.30
    tp_mode: next_zone_or_rr
    tp_rr: 2.0
    trail_after_rr: 1.5
    max_hold_bars: 96
  A2_structure_entry:                 # 第三阶段模式 A：到达关键区域 → 执行周期微结构确认（默认关闭，研究时显式选择）
    enabled: false
    zone_tfs: [1w, 1d]
    touch_tol_atr: 0.25
    max_undercut_atr: 1.0             # 微结构低点最多跌破区域下沿 1 ATR
    invalidate_atr: 1.0               # 收盘跌破区域下沿 1 ATR → 支撑丢失，放弃
    max_bars_after_touch: 24
    micro_buffer_atr: 0.2
    sl_buffer_atr: 0.5                # 结构止损（区域另一侧）的缓冲，供 stop_mode 对照
    default_stop: micro               # micro | structure
    allow_counter_trend: false        # 4h 结构逆势不做
    tp_mode: next_zone_or_rr
    tp_rr: 2.0
    trail_after_rr: 1.5
    max_hold_bars: 96
  A3_breakout_second_confirm:         # 第三阶段模式 B：4h 有效突破 → 首次回踩 → 微结构确认；无回踩则放弃
    enabled: false
    zone_tfs: [1w, 1d]
    max_wait_retest_bars: 48
    touch_tol_atr: 0.25
    max_undercut_atr: 1.0
    invalidate_atr: 1.0
    max_bars_after_touch: 24
    micro_buffer_atr: 0.2
    sl_buffer_atr: 0.5
    default_stop: micro
    tp_mode: next_zone_or_rr
    tp_rr: 2.0
    trail_after_rr: 1.5
    max_hold_bars: 96
  priority: [A_breakout_retest, B_reclaim, C_rejection, A2_structure_entry, A3_breakout_second_confirm]   # 同一根 K 线多策略同向触发时的取舍（按净盈亏比择优，再按此顺序）

filters:
  enabled: true
  volume:
    enabled: true
    lookback: 20
    min_ratio_breakout: 1.20          # 突破/假突破根成交量 ≥ 20 根均量×1.2
    min_ratio_rejection: 0.80
  volatility:
    enabled: true
    atr_pct_min: 0.0010               # exec ATR/价格 < 0.10% → 波动过低，不交易
    atr_pct_max: 0.0300               # exec ATR/价格 > 3% → 极端波动，不开新仓
    stop_distance_min_atr: 0.5        # 止损距离至少 0.5 ATR（否则噪声扫损）
    stop_distance_max_atr: 4.0
  derivatives:                        # 可选：资金费率 / 未平仓量（本环境交易所域名被拒 → 无数据时自动关闭并在报告中注明）
    enabled: false
    funding_abs_max: 0.0010           # |资金费率| > 0.1%/8h 时不顺着拥挤方向开仓
    oi_change_lookback: 6
  onchain:                            # 可选：CoinMetrics 社区数据（spot90 已采集，含 published_at，按发布时间对齐）
    enabled: false
    exchange_netflow_z_lookback: 30
    block_long_if_netflow_z_gt: 2.0   # 交易所净流入 z 分数 > 2 时不做多（卖压信号，研究假设）
    block_short_if_netflow_z_lt: -2.0
  regime:
    enabled: true
    block_counter_trend_in_strong_trend: true
    block_new_in_highvol: false
  cost:
    enabled: true
    max_cost_to_risk: 0.25            # 往返成本 / 止损风险 > 25% → 不交易
    min_net_rr: 2.0

risk:
  account_equity_usdt: 10000
  risk_per_trade: 0.005               # 0.5%，允许 0.0025 ~ 0.01
  risk_per_trade_min: 0.0025
  risk_per_trade_max: 0.01
  min_net_rr: 2.0
  max_total_risk: 0.02                # 全部未平仓风险（到止损的损失）≤ 2% 净值
  max_positions: 3
  max_same_direction_correlated: 2    # BTC/ETH 高相关：同向最多 2 笔
  correlation_group: {BTCUSDT: crypto_major, ETHUSDT: crypto_major, SOLUSDT: crypto_major, HYPEUSDT: crypto_alt}
  daily_loss_limit: 0.02              # 当日已实现+浮动亏损达 2% → 暂停新开仓至 UTC 次日
  max_leverage: 3.0
  margin_mode: isolated
  liquidation_buffer: 0.5             # 止损价到估算强平价的距离至少 0.5×止损距离
  maintenance_margin_rate: 0.005
  forbid_averaging_down: true
  forbid_martingale: true
  instruments:
    BTCUSDT: {spot: true, perp: true, qty_step: 0.0001, price_tick: 0.1, min_notional: 5}
    ETHUSDT: {spot: true, perp: true, qty_step: 0.001, price_tick: 0.01, min_notional: 5}
    SOLUSDT: {spot: true, perp: true, qty_step: 0.01, price_tick: 0.001, min_notional: 5}
    HYPEUSDT: {spot: false, perp: true, qty_step: 0.01, price_tick: 0.001, min_notional: 5}
  direction_policy: perp_both         # spot_only（仅现货做多）| perp_both（合约多空）| perp_long_spot（做多走现货、做空走合约）

costs:
  spot: {taker_fee_bps: 10, maker_fee_bps: 10, slippage_bps: 5}
  perp: {taker_fee_bps: 6, maker_fee_bps: 2, slippage_bps: 5}
  funding:                            # 无历史资金费率数据时的保守假设：多头每 8 小时付 0.01%，空头不收取（不假设收益）
    assumed_rate_8h: 0.0001
    long_pays: true
    short_receives: false
  stop_slippage_bps: 10               # 止损单成交额外滑点
  gap_fill_at_open: true              # 跳空越过止损/止盈时按开盘价成交

backtest:
  start: null
  end: null
  same_bar_rule: stop_first           # 同一 K 线内止盈止损都可能触发 → 保守按止损成交
  entry_fill: next_open               # 信号在 K 线收盘确认，下一根开盘成交
  initial_equity: 10000
  regimes_min_trades: 5
  walkforward:
    train_months: 12
    valid_months: 6
    test_months: 6
    min_trades_select: 15
    embargo_days: 7                   # 训练/验证/测试窗之间的隔离天数（防止持仓跨窗泄漏）
    grid:                             # 键可为策略参数名或完整配置路径（如 exits.breakeven_after_rr）
      A_breakout_retest: {break_buffer_atr: [0.10, 0.15, 0.25], sl_buffer_atr: [0.3, 0.5], exits.breakeven_after_rr: [null, 1.5]}
      B_reclaim: {min_break_depth_atr: [0.10, 0.15, 0.30], sl_buffer_atr: [0.3, 0.5], exits.breakeven_after_rr: [null, 1.5]}
      C_rejection: {wick_ratio_min: [0.50, 0.55, 0.65], sl_buffer_atr: [0.3, 0.5], exits.breakeven_after_rr: [null, 1.5]}

paper:
  enabled: true
  poll_interval_s: 300
  state_file: reports_out/brando_pa/paper/state.json
  log_file: reports_out/brando_pa/paper/trades.jsonl
  lock_file: data_store/brando_pa/.paper.lock
  max_retries: 4
  retry_backoff_s: 2
  rate_limit_rps: 5
  alert_webhook_env: BRANDO_ALERT_WEBHOOK   # 只从环境变量读取，不写日志
  circuit_breakers:                         # 异常熔断（触发后暂停新开仓，持仓照常管理）
    max_drawdown: 0.10                      # 模拟盘峰值回撤 ≥ 10%
    max_consecutive_losses: 8
  require_realtime_for_new_entries: true    # 非实时数据（公开缓存/过期）时禁止新开仓（data_ok=False 已实现）

execution:
  live_trading: false                 # 真实下单总开关；即便为 true，还需 BRANDO_LIVE_CONFIRM=I_UNDERSTAND 环境变量 + --confirm-live 参数
  live_confirm_env: BRANDO_LIVE_CONFIRM

paths:
  report_dir: reports_out/brando_pa

# ===================== 第二阶段：执行机制 / 退出 / 多周期 / 环境策略 / 评估器 =====================
execution_modes:
  entry_mode: market                # market = 收盘确认后下一根开盘市价；limit = 在关键区域边界挂限价等回踩
  limit:
    max_wait_bars: 8                # 挂单最多等待的执行 K 线数，超时自动取消
    penetration_atr: 0.05           # 保守成交模型：后续 K 线必须穿越挂单价 ≥ 0.05×ATR 才算成交（仅触及不算）
    improve_cap_atr: 1.0            # 挂单价相对信号收盘最多改善 1×ATR
    cancel_on_invalidation: true    # 结构失效（收盘越过失效价）立即撤单
    cancel_if_tp_hit_first: true    # 未成交期间价格先到止盈 → 撤单并记为“机会损失”
    maker_fill_uses_maker_fee: true

exits:                              # 每项可独立开关；参数由训练窗选择、样本外验证（见 walkforward.grid）
  stop_mode: atr_buffer             # fixed_structure（止损 = 结构失效点）| atr_buffer（结构点外 sl_buffer_atr×ATR）
  tp_mode: next_zone_or_rr          # next_zone_or_rr | rr | none
  breakeven_after_rr: 1.5           # 浮盈达 N R 后止损移到保本（含双边费用）；null 关闭
  atr_trail: null                   # 例 {after_rr: 2.0, atr_mult: 2.0}：浮盈 ≥ after_rr 后按 收盘 ∓ atr_mult×ATR 跟踪
  structure_exit: false             # 执行周期收盘越过信号失效价 → 市价退出
  time_exit: true                   # 持仓超过策略 max_hold_bars → 退出
  partial_tp: null                  # 例 {at_rr: 1.0, fraction: 0.5}：达 at_rr 平掉 fraction，余仓止损移到保本
  never_widen_stop: true            # 硬约束：止损只允许向有利方向移动

mtf:
  mode: single                      # single | aligned | zone_limit
  aligned_require_4h: true          # aligned/zone_limit：4h 结构方向须与信号一致（range 不允许）
  aligned_require_1d: true          # 日线环境不得与信号方向相反（down/strong_down 不做多，up/strong_up 不做空）
  zone_limit_require_htf_zone: true # zone_limit：信号区域必须含 1w 或 1d
  confirm_tf: null                  # 预留：15m 精细确认（本环境 15m 仅 2024-12 起）

regime_policy:                      # 每策略允许的 4 类环境（上涨趋势/下跌趋势/横盘震荡/高波动异常）；null = 不限制。只能由训练窗决定。
  A_breakout_retest: null
  B_reclaim: null
  C_rejection: null

evaluator:                          # Strategy Evaluator 最低门槛（样本外）
  min_trades: 30
  min_expectancy_r: 0.0
  min_profit_factor: 1.10
  max_drawdown: 0.20
  min_fold_nonneg_share: 0.5        # 测试折中期望 ≥ 0 的占比
  bootstrap_ci_lower_r_min: -0.05   # 均值 R 的 95% 置信下限
  paper_requires_ci_lower_gt0: true # 进入模拟盘候选：置信下限 > 0 且交易数 ≥ paper_min_trades
  paper_min_trades: 50
  tf_policy: {4h: analysis_only}    # 4h 默认只做趋势/结构分析，不产生模拟盘开仓

# ===================== 第四阶段：BTC/ETH 纯现货价格行为系统（src/brando_pa/spot/） =====================
spot:
  symbols: [BTCUSDT, ETHUSDT]
  exec_tf: 1h                        # 执行周期（本地结构 / 入场 / 止损）；可用 4h 跑长历史对照
  refine_tf: 15m                     # 可得时用 15m 已确认结构辅助定位（仅 2024-12-30 起有数据；缺失时自动跳过）
  initial_cash_usdt: 10000
  htf_context:                       # 高周期（1w/1d/4h）只做市场背景与机会判断，不作为 1h 止损距离
    zone_tfs: [1w, 1d, 4h]
    near_support_atr_1d: 1.0         # 价格距高周期支撑区 ≤ 1×ATR(1d) 视为“在高周期支撑附近”（机会背景）
    block_buy_regimes: [强势下跌]     # 日线环境为强势下跌时不买（市场背景过滤，可配置为空）
  local_structure:                   # 低周期执行区域：执行周期已确认摆动高低点
    swing_k: 3
    lookback_bars: 120               # 只用最近 120 根内的已确认摆动点作为本地支撑/阻力
    level_tol_atr: 0.15              # 同一价位的容差（摆动点聚类 / 触及判定）
    max_levels_each_side: 4
    min_level_age_bars: 3            # 摆动点确认后至少再过 3 根才算“有效”阻力/支撑（避免刚形成的点）
  strategies:
    A_breakout_retest_buy:
      enabled: true
      break_buffer_atr: 0.10         # 收盘越过本地阻力 ≥ 0.10 ATR 算有效突破
      max_wait_retest_bars: 24
      retest_tol_atr: 0.20
      confirm_close_pct: 0.60
      confirm_within_bars: 6
      stop_buffer_atr: 0.20          # 止损 = min(回踩低点, 阻力位) − 0.20 ATR（本地结构，不是高周期区域另一侧）
    B_breakdown_reclaim_buy:
      enabled: true
      min_break_depth_atr: 0.15
      max_break_depth_atr: 1.50
      max_bars_outside: 6
      reclaim_close_pct: 0.55
      stop_buffer_atr: 0.20          # 止损 = 跌破期间最低价 − 0.20 ATR
    C_resistance_rejection_sell:
      enabled: true
      wick_ratio_min: 0.55
      close_pct_max: 0.35
      range_atr_min: 0.80
      sell_fraction: 0.5             # 阻力拒绝时卖出持仓的比例（0.5 = 减半；1.0 = 清仓）
      use_htf_resistance: true       # 高周期阻力区也算“关键阻力”（背景用途）
      cooldown_bars: 12
  exits:
    hard_stop: true                  # 结构失效硬止损（入场时确定，只能上移）
    breakeven_after_r: 1.0           # 浮盈 ≥ 1R 后止损上移到保本
    trail_to_swing_low_after_r: 1.5  # 浮盈 ≥ 1.5R 后，止损跟随最近已确认的 1h 摆动低点（只上移）
    tp_at_htf_resistance: false      # 到达高周期阻力区是否直接止盈（默认关，由策略 C 处理）
    max_hold_bars: null              # 现货不设时间退出（null）
  risk:
    risk_per_trade: 0.01             # 单笔风险预算 = 净值 × 1%（止损距离决定数量）
    max_position_pct: 1.0            # 单资产持仓市值 ≤ 净值 × 比例（双资产模式各 0.5）
    max_position_pct_dual: 0.5
    max_drawdown_halt: 0.20          # 净值自峰值回撤 ≥ 20% → 暂停新买入，直至回撤收窄到一半
    min_order_usdt: 10
    qty_step: {BTCUSDT: 0.00001, ETHUSDT: 0.0001}
  costs:
    research_mode: true              # true：手续费 0、滑点 0（理想条件研究）
    sensitivity: {fee_bps: 10, slippage_bps: 5}   # 成本敏感性开关使用的真实成本
    entry_fill: next_open
    same_bar_rule: stop_first
  windows:                           # 预先登记（见 docs/brando_pa_validation/phase4_spot/preregistration.md）
    train: ["2022-04-01", "2024-06-30"]
    valid: ["2024-07-01", "2025-06-30"]
    holdout: ["2025-07-01", null]
    locked_unused_1h: ["2022-01-01", "2022-03-31"]
    full_4h: ["2018-01-01", null]

# ===================== 第五阶段：纯现货趋势参与 / 持仓优化（src/brando_pa/trend/） =====================
trend:
  symbols: [BTCUSDT, ETHUSDT]
  exec_tf: 1h
  initial_cash_usdt: 10000
  regime:                              # 日线趋势状态（只用已收盘日线）
    sma_fast: 50
    sma_slow: 200
    slope_lookback_days: 20            # SMA50 斜率 = (SMA50_t − SMA50_{t−20}) / SMA50_{t−20}
    slope_min: 0.0                     # BULL 要求 SMA50 斜率 > 0；BEAR 要求 < 0
    band_atr: 0.5                      # |SMA50 − SMA200| < 0.5×ATR(1d) 视为均线纠缠 → RANGE
    structure_lookback_days: 60        # 历史高低点结构：收盘创 60 日新高支持 BULL，创 60 日新低支持 BEAR
    atr_n: 14
    confirm_days: 1                    # 状态切换需连续 N 个日线收盘满足
  models:
    A_trend_following:                 # 模型 A：日线 BULL 买入并持有，只按预登记退出
      enabled: true
      allocation: 1.0                  # 单资产模式满仓比例（双资产 0.5）
      entry_on: BULL                   # 日线状态进入 BULL（确认后下一根执行 K 线开盘）
      reentry_allowed: true
    B_core_satellite:                  # 模型 B：核心仓位（趋势管理）+ 战术仓位（Brando A/B）
      enabled: true
      core_fraction: 0.5               # 预登记候选，不代表最优
      tactical_fraction: 0.5
      tactical_risk_per_trade: 0.01    # 战术单笔风险 = 战术资金 × 1%
    C_trend_filtered_brando:           # 模型 C：日线 BULL 且 4h 非 down 时才用 Brando A/B 买入
      enabled: true
      require_4h_not_down: true
      risk_per_trade: 0.01
      max_position_pct: 1.0
      strategy_c_action: reduce_25     # 策略 C 阻力拒绝只作风险提示：减仓 25%，不清仓
  exits:                               # 三种退出各自独立运行，不事后挑选
    A_structure_stop: {stop_buffer_atr: 0.2}                                   # Brando 结构止损（趋势入场用日线摆动低/ SMA50 下方 1 ATR 作结构）
    B_trend_failure: {exit_when: not_BULL, grace_days: 2}                      # 日线状态离开 BULL 且持续 grace_days 个日线收盘 → 退出
    C_atr_trailing: {atr_mult: 3.0, atr_tf: 1d}                                # 吊灯止损：自入场以来最高收盘 − 3×ATR(1d)，只上移
    hard_limits: {max_drawdown_halt: 0.20, max_position_pct: 1.0, max_position_pct_dual: 0.5, crash_exit_daily_drop: 0.15}   # 单日跌幅 ≥15% 的异常风险退出
  benchmarks:
    sma200: {sma: 200}                 # 简单趋势基准：日线收盘 > SMA200 持有，< SMA200 空仓（下一根 1h 开盘执行）
    fixed_5050: {spot_fraction: 0.5}   # 期初 50% 现货 + 50% USDT，不再平衡
  costs:
    round1: {fee_bps: 0, slippage_bps: 0}
    round2: {fee_bps: 10, slippage_bps: 5}
  windows:
    train: ["2022-04-01", "2024-06-30"]
    valid: ["2024-07-01", "2025-06-30"]
    holdout: ["2025-07-01", null]
    locked_unused_1h: ["2022-01-01", "2022-03-31"]
    full_1h: ["2022-04-01", null]
    full_4h: ["2018-06-01", null]       # 4h 执行的长历史（跨牛熊）

# ===================== 第六阶段：三层现货趋势系统（趋势层 / 仓位层 / 风险层）=====================
trendsys:
  symbols: [BTCUSDT, ETHUSDT]
  exec_tf: 1h
  initial_cash_usdt: 10000
  trend:                               # 趋势层：只用已收盘日线
    sma: 200
    strategies:
      A_sma200: {confirm_days: 1}      # 对照组：日线收盘 > SMA200 即持有（与第五阶段 sma200_benchmark 完全一致）
      B_sma200_confirm3: {confirm_days: 3}   # 唯一预登记的收盘确认方案：连续 3 个日线收盘在另一侧才切换
    sensitivity_confirm_days: [2, 4]   # 事后 ±1 日敏感性，只报告不选择
  position:                            # 仓位层
    cash_buffer: 0.001                 # 买入保留 0.1% 现金（与第五阶段基准一致）
    min_order_usdt: 10
  risk:                                # 风险层：回撤熔断状态机（预登记参数）
    modes: [original_permanent, state_machine, none]
    original_permanent: {halt_dd: 0.20, resume_dd: 0.10}       # 第五阶段原规则（全程高水位、只暂停买入）
    state_machine:
      reduce_dd: 0.10                  # NORMAL → RISK_REDUCED
      reduce_cap: 0.50                 # RISK_REDUCED / RECOVERY 允许的最大仓位
      recover_dd: 0.05                 # RISK_REDUCED → NORMAL（滞后）
      halt_dd: 0.20                    # → EMERGENCY_HALT（全部卖出）
      cooldown_days_per_halt: 30       # 冷静期 = 30 × min(熔断计数, 3)
      cooldown_max_multiplier: 3
      recovery_days: 60                # 恢复期满 60 日未再触发 → NORMAL
      recovery_retrigger_dd: 0.10      # 恢复期相对恢复期高点回撤 ≥ 10% → 再次熔断
      halt_count_reset_days: 180       # NORMAL 连续 180 日无熔断 → 计数清零
      crash_exit_daily_drop: 0.15      # 单日线跌幅 ≥ 15% → EMERGENCY_HALT
    data_fault_max_bar_age_multiplier: 3
  brando_signals:
    enabled: false                     # 价格行为辅助模块默认关闭；保留第四、五阶段研究与可视化
  audit:
    phase5_data_cutoff: "2026-11-06 09:00"   # 第五阶段 sma200_benchmark 结果所用数据的最后一根 1h K 线（复现对比必须用同一截止）
  costs:
    round1: {fee_bps: 0, slippage_bps: 0}
    round2: {fee_bps: 10, slippage_bps: 5}
  windows:
    train: ["2022-04-01", "2024-06-30"]
    valid: ["2024-07-01", "2025-06-30"]
    holdout: ["2025-07-01", null]
    locked_unused_1h: ["2022-01-01", "2022-03-31"]
    full_1h: ["2022-04-01", null]
    full_4h: ["2018-06-01", null]
  window_labels:
    train: 训练（已观察）
    valid: 验证（已观察）
    holdout: 已被观察的测试窗（不是样本外）
    locked_unused_1h: 真正未使用（3 个月，统计力极低）
    full_1h: 全周期 1h（已观察）
    full_4h: 长历史 4h（已观察）
  paper:
    state_file: reports_out/brando_pa/trendsys_paper/state.json
    log_dir: reports_out/brando_pa/trendsys_paper

# ===================== 第七阶段：BTC/ETH/USDT 纯现货动态资金配置与最终 USDT 利润 =====================
usdt:
  symbols: [BTCUSDT, ETHUSDT]
  exec_tf: 1h
  initial_cash_usdt: 10000
  trend: {sma: 200, confirm_days: 1}   # 各资产原始 SMA200（与第六阶段策略 A 相同）
  models:                              # 预登记权重：(b,e) → {BTC, ETH}；其余为 USDT
    A_equal_weight:   {both: {BTCUSDT: 0.5, ETHUSDT: 0.5}, btc_only: {BTCUSDT: 0.5}, eth_only: {ETHUSDT: 0.5}, none: {}}
    B_full_single:    {both: {BTCUSDT: 0.5, ETHUSDT: 0.5}, btc_only: {BTCUSDT: 1.0}, eth_only: {ETHUSDT: 1.0}, none: {}}
    C_cash_reserve:   {both: {BTCUSDT: 0.4, ETHUSDT: 0.4}, btc_only: {BTCUSDT: 0.8}, eth_only: {ETHUSDT: 0.8}, none: {}, max_total_exposure: 0.8}   # 硬上限：实际敞口 > 80% 即再平衡回目标
  allocator:
    drift_band: 0.10                   # 实际权重偏离目标 ≥ 10 个百分点 → 再平衡（每日线收盘检查）
    min_rebalance_usdt: 10
    min_rebalance_frac: 0.005          # 最小再平衡金额 = max(10 USDT, 权益 × 0.5%)
    cash_buffer: 0.001
  risk:
    modes: [original_permanent, state_machine, none]   # 参数复用 trendsys.risk
  risk_constraint:
    max_drawdown: 0.30                 # 外部占位上限；未经用户批准，只用于排行榜标注
    approved_by_user: false
  costs:
    round1: {fee_bps: 0, slippage_bps: 0}
    round2: {fee_bps: 10, slippage_bps: 5}
  windows:
    train: ["2022-04-01", "2024-06-30"]
    valid: ["2024-07-01", "2025-06-30"]
    holdout: ["2025-07-01", null]
    locked_unused_1h: ["2022-01-01", "2022-03-31"]
    full_1h: ["2022-04-01", null]
    full_4h: ["2018-06-01", null]
  window_labels:
    train: 训练（已观察）
    valid: 验证（已观察）
    holdout: 已被观察的测试窗（不是样本外）
    locked_unused_1h: 真正未使用（3 个月，统计力极低）
    full_1h: 全周期 1h（已观察）
    full_4h: 长历史 4h（已观察）
  regime_month_threshold: 0.03         # 月收益 > +3% 上涨、< −3% 下跌、其余横盘（诊断用）
  paper:
    log_dir: reports_out/brando_pa/usdt_paper
    model: A_equal_weight
    risk_mode: state_machine
