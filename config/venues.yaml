  SPY:  {candidates: [{venue: bgw_rwa_xstocks, token: SPYx}, {venue: bgw_rwa_ondo, token: SPYon}, {venue: bgw_rwa_reality, token: rSPY}], verification: unverified}
  QQQ:  {candidates: [{venue: bgw_rwa_xstocks, token: QQQx}, {venue: bgw_rwa_ondo, token: QQQon}, {venue: bgw_rwa_reality, token: rQQQ}], verification: unverified}
  MU:   {candidates: [{venue: bgw_rwa_xstocks, token: MUx}, {venue: bgw_rwa_ondo, token: MUon}], verification: unverified}
  MSFT: {candidates: [{venue: bitget_spot_rtoken, token: rMSFT, pair_candidates: [rMSFTUSDT, RMSFTUSDT], chain: cex_spot}, {venue: bgw_rwa_xstocks, token: MSFTx}, {venue: bgw_rwa_ondo, token: MSFTon}], verification: unverified}
  SNDK: {candidates: [{venue: bitget_spot_rtoken, token: rSNDK, pair_candidates: [rSNDKUSDT, RSNDKUSDT], chain: cex_spot}, {venue: bgw_rwa_ondo, token: SNDKon}], verification: unverified}
  INTC: {candidates: [{venue: bitget_spot_rtoken, token: rINTC, pair_candidates: [rINTCUSDT, RINTCUSDT], chain: cex_spot}, {venue: bgw_rwa_xstocks, token: INTCx}, {venue: bgw_rwa_ondo, token: INTCon}], verification: unverified}
  META: {candidates: [{venue: bitget_spot_rtoken, token: rMETA, pair_candidates: [rMETAUSDT, RMETAUSDT], chain: cex_spot}, {venue: bgw_rwa_xstocks, token: METAx}, {venue: bgw_rwa_ondo, token: METAon}], verification: unverified}
